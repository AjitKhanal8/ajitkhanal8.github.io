<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">How aes works in ggplot2</title>
  <desc id="desc">A simple diagram showing data flowing into aes mapping and then into a geom that draws the plot, with a second panel showing mapping versus setting color.</desc>
  <rect width="1600" height="900" fill="#F8F4ED"/>
  <rect x="48" y="48" width="1504" height="804" rx="32" fill="#FFFDF8" stroke="#D8CFC1" stroke-width="2"/>

  <text x="90" y="128" fill="#1E2A38" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700">How ggplot2::aes() works</text>
  <text x="90" y="174" fill="#4E5A67" font-family="'Helvetica Neue', Arial, sans-serif" font-size="26">Mental model: aes() creates visual instructions; geoms use them to draw.</text>

  <rect x="90" y="235" width="360" height="260" rx="24" fill="#EEF3F7" stroke="#B8C7D3" stroke-width="2"/>
  <text x="124" y="290" fill="#1E2A38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700">1. Data</text>
  <text x="124" y="338" fill="#4E5A67" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24">A table of observations</text>
  <rect x="124" y="368" width="292" height="86" rx="16" fill="#FFFFFF" stroke="#D5DEE6"/>
  <text x="144" y="404" fill="#243443" font-family="'SFMono-Regular', Consolas, monospace" font-size="21">income   crop_yield   region</text>
  <text x="144" y="434" fill="#243443" font-family="'SFMono-Regular', Consolas, monospace" font-size="21">42000    3.4          East</text>
  <text x="144" y="464" fill="#243443" font-family="'SFMono-Regular', Consolas, monospace" font-size="21">38000    2.9          West</text>

  <rect x="620" y="235" width="360" height="260" rx="24" fill="#F4EFE7" stroke="#D3C6B2" stroke-width="2"/>
  <text x="654" y="290" fill="#1E2A38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700">2. aes()</text>
  <text x="654" y="338" fill="#4E5A67" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24">Map variables to visual roles</text>
  <rect x="654" y="368" width="292" height="86" rx="16" fill="#FFFFFF" stroke="#DED4C7"/>
  <text x="674" y="404" fill="#243443" font-family="'SFMono-Regular', Consolas, monospace" font-size="22">x     &lt;- income</text>
  <text x="674" y="434" fill="#243443" font-family="'SFMono-Regular', Consolas, monospace" font-size="22">y     &lt;- crop_yield</text>
  <text x="674" y="464" fill="#243443" font-family="'SFMono-Regular', Consolas, monospace" font-size="22">color &lt;- region</text>

  <rect x="1150" y="235" width="312" height="260" rx="24" fill="#EEF6EF" stroke="#B9D2BD" stroke-width="2"/>
  <text x="1184" y="290" fill="#1E2A38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700">3. geom</text>
  <text x="1184" y="338" fill="#4E5A67" font-family="'Helvetica Neue', Arial, sans-serif" font-size="24">Draw the marks</text>
  <rect x="1184" y="372" width="244" height="88" rx="18" fill="#FFFFFF" stroke="#D4E2D6"/>
  <circle cx="1240" cy="416" r="18" fill="#A45A52"/>
  <circle cx="1298" cy="398" r="13" fill="#5E7C5B"/>
  <circle cx="1362" cy="428" r="22" fill="#6E8FB2"/>
  <text x="1184" y="472" fill="#243443" font-family="'SFMono-Regular', Consolas, monospace" font-size="22">geom_point()</text>

  <path d="M465 365C525 365 545 365 605 365" stroke="#9AA9B5" stroke-width="8" stroke-linecap="round"/>
  <path d="M588 347L625 365L588 383" fill="none" stroke="#9AA9B5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M995 365C1050 365 1070 365 1130 365" stroke="#9AA9B5" stroke-width="8" stroke-linecap="round"/>
  <path d="M1113 347L1150 365L1113 383" fill="none" stroke="#9AA9B5" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="90" y="575" width="1372" height="210" rx="24" fill="#FBF8F1" stroke="#DDD3C4" stroke-width="2"/>
  <text x="124" y="635" fill="#1E2A38" font-family="'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700">Mapping vs setting</text>

  <rect x="124" y="668" width="600" height="86" rx="18" fill="#FFFFFF" stroke="#D9E1E8"/>
  <text x="150" y="705" fill="#243443" font-family="'SFMono-Regular', Consolas, monospace" font-size="23">aes(color = region)</text>
  <text x="150" y="738" fill="#4E5A67" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22">Maps a variable. Color changes with the data.</text>

  <rect x="838" y="668" width="590" height="86" rx="18" fill="#FFFFFF" stroke="#D9E1E8"/>
  <text x="864" y="705" fill="#243443" font-family="'SFMono-Regular', Consolas, monospace" font-size="23">color = "steelblue"</text>
  <text x="864" y="738" fill="#4E5A67" font-family="'Helvetica Neue', Arial, sans-serif" font-size="22">Sets a fixed style. Every mark gets the same color.</text>
</svg>
